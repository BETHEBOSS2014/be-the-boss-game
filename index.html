<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BE THE BOSS | Business Simulation</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Inter', sans-serif;
}

body {
    background-color: #0f172a;
    color: #e2e8f0;
    display: flex;
    height: 100vh;
}

.sidebar {
    width: 240px;
    background: #111827;
    padding: 30px 20px;
    display: flex;
    flex-direction: column;
}

.logo {
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 40px;
    color: #fbbf24;
}

.nav-item {
    margin-bottom: 20px;
    cursor: pointer;
    color: #cbd5e1;
    transition: 0.2s;
}

.nav-item:hover {
    color: #fbbf24;
}

.main {
    flex: 1;
    padding: 30px;
    display: flex;
    flex-direction: column;
}

.topbar {
    display: flex;
    justify-content: space-between;
    margin-bottom: 30px;
}

.metric {
    background: #1e293b;
    padding: 15px 25px;
    border-radius: 12px;
    text-align: center;
    min-width: 150px;
}

.metric h3 {
    font-size: 14px;
    color: #94a3b8;
    margin-bottom: 5px;
}

.metric p {
    font-size: 18px;
    font-weight: 600;
}

.content {
    background: #1e293b;
    flex: 1;
    border-radius: 16px;
    padding: 30px;
}

.content h2 {
    margin-bottom: 20px;
    font-weight: 600;
}

.button {
    background: #fbbf24;
    border: none;
    padding: 12px 20px;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.2s;
}

.button:hover {
    background: #f59e0b;
}
</style>
</head>

<body>

<div class="sidebar">
    <div class="logo">BE THE BOSS</div>
    <div class="nav-item">Dashboard</div>
    <div class="nav-item">Production</div>
    <div class="nav-item">Marketing</div>
    <div class="nav-item">Finance</div>
    <div class="nav-item">Analytics</div>
    <div class="nav-item">Reports</div>
</div>

<div class="main">

    <div class="topbar">
        <div class="metric">
            <h3>Cash</h3>
            <p>€50,000</p>
        </div>
        <div class="metric">
            <h3>Revenue</h3>
            <p>€12,300</p>
        </div>
        <div class="metric">
            <h3>Expenses</h3>
            <p>€7,400</p>
        </div>
        <div class="metric">
            <h3>Profit</h3>
            <p>€4,900</p>
        </div>
    </div>

    <div class="content">
        <h2>Strategic Decision Panel</h2>
        <p>Select your next business move carefully. Every decision impacts growth, risk, and long-term performance.</p>
        <br>
        <button class="button">Make Decision</button>
    </div>

</div>

</body>
</html>
